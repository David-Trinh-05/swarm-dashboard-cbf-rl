name: Offline checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Recompute and upload offline CBF-RL policy reports
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install offline test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64
          python -m pip install -r requirements-test.txt
      - name: Check dashboard, CBF and Offboard contracts
        run: bash scripts/test-core.sh

  offline-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the offline evaluator dependency
        run: python -m pip install numpy==2.4.4
      - name: Evaluate all three policies
        run: |
          mkdir -p benchmark-results
          python cbf_rl_evaluate.py --model cbf_rl_policy_v1.json --output benchmark-results/v1.json || test "$?" -eq 1
          python cbf_rl_evaluate.py --model cbf_rl_policy_v2.json --output benchmark-results/v2.json || test "$?" -eq 1
          python cbf_rl_evaluate.py --model cbf_rl_policy_mission_v1.json --output benchmark-results/mission-v1.json
          python -c 'import json; from pathlib import Path; root = Path("benchmark-results"); assert {p.stem: json.loads(p.read_text())["verdict"] for p in root.glob("*.json")} == {"v1": "FAIL", "v2": "FAIL", "mission-v1": "PASS"}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbf-rl-offline-reports
          path: benchmark-results/
